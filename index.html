<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Phone Packages for Smb - Light</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
        }

        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            padding-top: env(safe-area-inset-top);
            height: calc(65px + env(safe-area-inset-top));
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 0.5px solid #d1d1d6;
        }

        header span {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
            color: #1c1c1e;
        }

        .cart-icon {
            position: absolute;
            right: 20px;
            bottom: 18px;
            width: 28px;
            height: 28px;
            cursor: pointer;
        }

        .cart-icon svg {
            width: 100%;
            height: 100%;
            stroke: #1c1c1e;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff3b30;
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            display: none;
        }

        .container {
            padding: calc(85px + env(safe-area-inset-top)) 15px 40px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .phone-wrapper {
            display: flex;
            flex-direction: column;
        }

        .phone-card {
            background: #ffffff;
            border-radius: 18px;
            height: 180px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            cursor: pointer;
            border: 1px solid #e5e5ea;
            overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-radius 0.25s ease;
        }

        .phone-card:active { transform: scale(0.97); }

        .phone-card.selected {
            border: 2.5px solid #007aff;
            background-color: #f0f6ff;
        }

        .phone-wrapper.open .phone-card {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }

        .img-left {
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f7;
        }

        .img-left img {
            height: 85%;
            max-width: 90%;
            object-fit: contain;
        }

        .text-right {
            width: 50%;
            padding: 0 15px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #1c1c1e;
        }

        .size-options {
            max-height: 0;
            overflow: hidden;
            background: #ffffff;
            border: 0 solid #e5e5ea;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            transition: max-height 0.3s ease, border-width 0.3s ease;
        }

        .phone-wrapper.open .size-options {
            max-height: 340px;
            border-width: 0 1px 1px 1px;
        }

        .size-options-inner {
            display: flex;
            flex-direction: column;
            padding: 8px 12px 12px 12px;
            gap: 8px;
        }

        .size-option {
            background: #f2f2f7;
            color: #1c1c1e;
            border: 1px solid #d1d1d6;
            border-radius: 12px;
            padding: 18px 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .size-option:active {
            transform: scale(0.97);
            background: #007aff;
            color: #fff;
        }

        /* Cart view */
        #cart-view {
            display: none;
            padding: calc(85px + env(safe-area-inset-top)) 20px 100px 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            background: #ffffff;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 14px;
            border: 0.5px solid #e5e5ea;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
        }

        .cart-item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-right: 15px;
            background: #f2f2f7;
            border-radius: 8px;
        }

        .cart-item-text {
            display: flex;
            flex-direction: column;
        }

        .cart-item-text small {
            color: #6e6e73;
            font-weight: 500;
            margin-top: 2px;
        }

        .btn-insights {
            -webkit-appearance: none;
            background: #007aff;
            color: white;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(0, 122, 255, 0.3);
            cursor: pointer;
        }

        /* Modal */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        #status-box {
            background: #007aff;
            color: white;
            padding: 35px;
            border-radius: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            min-width: 220px;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #status-box .done-icon {
            font-size: 64px;
        }

        #status-box p {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
        }

        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
    </style>
</head>
<body>

<header>
    <span>CHOOSE ITEMS</span>
    <div class="cart-icon" onclick="showCart()">
        <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span id="cart-count">0</span>
    </div>
</header>

<div class="container" id="phone-list">

    <div class="phone-wrapper" id="wrapper-1">
        <div class="phone-card" onclick="handleCardClick('wrapper-1', 'Blue Phone 15 Pro', 't1.png')">
            <div class="img-left"><img src="t1.png" alt="Blue Phone 15 Pro"></div>
            <div class="text-right">Blue Phone 15 Pro</div>
        </div>
        <div class="size-options">
            <div class="size-options-inner">
                <div class="size-option" onclick="selectSize(event,'wrapper-1','Blue Phone 15 Pro','t1.png','128 GB')">128 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-1','Blue Phone 15 Pro','t1.png','256 GB')">256 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-1','Blue Phone 15 Pro','t1.png','512 GB')">512 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-1','Blue Phone 15 Pro','t1.png','1 TB')">1 TB</div>
            </div>
        </div>
    </div>

    <div class="phone-wrapper" id="wrapper-2">
        <div class="phone-card" onclick="handleCardClick('wrapper-2', 'White Phone 16 Pro', 't2.png')">
            <div class="img-left"><img src="t2.png" alt="White Phone 16 Pro"></div>
            <div class="text-right">White Phone 16 Pro</div>
        </div>
        <div class="size-options">
            <div class="size-options-inner">
                <div class="size-option" onclick="selectSize(event,'wrapper-2','White Phone 16 Pro','t2.png','128 GB')">128 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-2','White Phone 16 Pro','t2.png','256 GB')">256 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-2','White Phone 16 Pro','t2.png','512 GB')">512 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-2','White Phone 16 Pro','t2.png','1 TB')">1 TB</div>
            </div>
        </div>
    </div>

    <div class="phone-wrapper" id="wrapper-3">
        <div class="phone-card" onclick="handleCardClick('wrapper-3', 'Pink Phone 17 Pro', 't3.png')">
            <div class="img-left"><img src="t3.png" alt="Pink Phone 17 Pro"></div>
            <div class="text-right">Pink Phone 17 Pro</div>
        </div>
        <div class="size-options">
            <div class="size-options-inner">
                <div class="size-option" onclick="selectSize(event,'wrapper-3','Pink Phone 17 Pro','t3.png','128 GB')">128 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-3','Pink Phone 17 Pro','t3.png','256 GB')">256 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-3','Pink Phone 17 Pro','t3.png','512 GB')">512 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-3','Pink Phone 17 Pro','t3.png','1 TB')">1 TB</div>
            </div>
        </div>
    </div>

    <div class="phone-wrapper" id="wrapper-4">
        <div class="phone-card" onclick="handleCardClick('wrapper-4', 'Black Phone 18 Pro', 't4.png')">
            <div class="img-left"><img src="t4.png" alt="Black Phone 18 Pro"></div>
            <div class="text-right">Black Phone 18 Pro</div>
        </div>
        <div class="size-options">
            <div class="size-options-inner">
                <div class="size-option" onclick="selectSize(event,'wrapper-4','Black Phone 18 Pro','t4.png','128 GB')">128 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-4','Black Phone 18 Pro','t4.png','256 GB')">256 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-4','Black Phone 18 Pro','t4.png','512 GB')">512 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-4','Black Phone 18 Pro','t4.png','1 TB')">1 TB</div>
            </div>
        </div>
    </div>

    <div class="phone-wrapper" id="wrapper-5">
        <div class="phone-card" onclick="handleCardClick('wrapper-5', 'Yellow Phone 19 Pro', 't5.png')">
            <div class="img-left"><img src="t5.png" alt="Yellow Phone 19 Pro"></div>
            <div class="text-right">Yellow Phone 19 Pro</div>
        </div>
        <div class="size-options">
            <div class="size-options-inner">
                <div class="size-option" onclick="selectSize(event,'wrapper-5','Yellow Phone 19 Pro','t5.png','128 GB')">128 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-5','Yellow Phone 19 Pro','t5.png','256 GB')">256 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-5','Yellow Phone 19 Pro','t5.png','512 GB')">512 GB</div>
                <div class="size-option" onclick="selectSize(event,'wrapper-5','Yellow Phone 19 Pro','t5.png','1 TB')">1 TB</div>
            </div>
        </div>
    </div>

</div>

<div id="cart-view">
    <h2 style="font-weight:800;font-size:2.2rem;margin-bottom:20px;color:#1c1c1e;">Cart</h2>
    <div id="cart-items-container"></div>
    <button class="btn-insights" onclick="showInsights()">Get Insights</button>
</div>

<div id="modal-overlay" onclick="closeModal()">
    <div id="status-box">
        <div class="done-icon">✅</div>
        <p>Processing...</p>
    </div>
</div>

<script>
    let selectedPhones = [];
    let openWrapperId = null;

    function handleCardClick(wrapperId, name, imgSrc) {
        const isSelected = selectedPhones.some(p => p.wrapperId === wrapperId);
        if (isSelected) { removePhone(wrapperId); return; }

        if (openWrapperId && openWrapperId !== wrapperId) {
            document.getElementById(openWrapperId).classList.remove('open');
        }
        const wrapper = document.getElementById(wrapperId);
        const isOpen = wrapper.classList.contains('open');
        if (isOpen) { wrapper.classList.remove('open'); openWrapperId = null; }
        else { wrapper.classList.add('open'); openWrapperId = wrapperId; }
    }

    function selectSize(event, wrapperId, name, imgSrc, size) {
        event.stopPropagation();
        selectedPhones.push({ name, imgSrc, size, wrapperId });
        const wrapper = document.getElementById(wrapperId);
        wrapper.classList.remove('open');
        wrapper.querySelector('.phone-card').classList.add('selected');
        openWrapperId = null;
        updateCartCount();
    }

    function removePhone(wrapperId) {
        selectedPhones = selectedPhones.filter(p => p.wrapperId !== wrapperId);
        const wrapper = document.getElementById(wrapperId);
        wrapper.classList.remove('open');
        wrapper.querySelector('.phone-card').classList.remove('selected');
        if (openWrapperId === wrapperId) openWrapperId = null;
        updateCartCount();
    }

    function updateCartCount() {
        const countTag = document.getElementById('cart-count');
        countTag.innerText = selectedPhones.length;
        countTag.style.display = selectedPhones.length > 0 ? 'block' : 'none';
    }

    function showCart() {
        window.scrollTo(0, 0);
        document.getElementById('phone-list').style.display = 'none';
        document.getElementById('cart-view').style.display = 'block';
        const container = document.getElementById('cart-items-container');
        container.innerHTML = '';
        if (!selectedPhones.length) {
            container.innerHTML = '<p style="color:#6e6e73;">Cart is empty</p>';
        }
        selectedPhones.forEach(phone => {
            const item = document.createElement('div');
            item.className = 'cart-item';
            item.innerHTML = `<img src="${phone.imgSrc}" alt="${phone.name}"><div class="cart-item-text"><b>${phone.name}</b><small>${phone.size}</small></div>`;
            container.appendChild(item);
        });
    }

    function showInsights() {
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }
</script>
</body>
</html>
